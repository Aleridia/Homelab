# Connection settings for the bundled PostgreSQL, referenced from values.yaml as
# `firefly-db.configs.existingSecret`. When that key is set the chart stops
# rendering its ConfigMap and mounts this Secret instead, so it must carry every
# variable the postgres container and the backup job read — POSTGRES_* seeds the
# database and its owning role on first boot, DB* and PGPASSWORD are what pg_dump uses.
#
# POSTGRES_HOST_AUTH_METHOD is deliberately absent: the chart defaults it to
# `trust`, which would let any pod that can reach :5432 connect without a
# password. Omitting it leaves the image on scram-sha-256.
apiVersion: v1
kind: Secret
metadata:
  name: firefly-db-config
  namespace: "{{ firefly_namespace | mandatory }}"
type: Opaque
stringData:
  POSTGRES_USER: "{{ db_user | mandatory }}"
  POSTGRES_PASSWORD: "{{ db_password | mandatory }}"
  POSTGRES_DB: "firefly"

  DBHOST: "firefly-db"
  DBPORT: "5432"
  DBNAME: "firefly"
  DBUSER: "{{ db_user | mandatory }}"
  PGPASSWORD: "{{ db_password | mandatory }}"

  TZ: "Europe/Paris"
