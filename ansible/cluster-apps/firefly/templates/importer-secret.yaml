# Firefly III Personal Access Token the data importer uses to push transactions
# into Firefly III, referenced from values.yaml as
# `importer.fireflyiii.auth.existingSecret`. The chart mounts it as
# FIREFLY_III_ACCESS_TOKEN and always reads the key `accessToken`.
#
# Create the token inside Firefly III first: Options -> Profile -> "Remote access
# and tokens" -> Personal Access Token -> Create new token. NOT the "command line
# token", which is a different thing and will not work.
apiVersion: v1
kind: Secret
metadata:
  name: firefly-importer-token
  namespace: "{{ firefly_namespace | mandatory }}"
type: Opaque
stringData:
  accessToken: "{{ importer_access_token | mandatory }}"
